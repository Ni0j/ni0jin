<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Design services for fictional worlds, visual identities, music and audience participation.">
  <title>Design Services &amp; Selected Work | Nio Jin</title>
  <link rel="canonical" href="https://niojin.com/services/">
  <link rel="stylesheet" href="site.css">
  <script src="../design/projects.js" defer></script>
  <script src="site.js" defer></script>
</head>
<body>
  <main>
    <header class="opening" aria-labelledby="commission-title">
      <div class="opening-copy" id="site-intro">
        <h1 id="commission-title">What do you want your audience to see, remember or do?</h1>
        <p class="opening-service">Make a fictional world feel real, get people to look twice at a product, give a track a visual identity, or turn viewers into participants.</p>
      </div>
    </header>
    <div id="stories"></div>
    <section class="inquiry measure" id="inquiry" aria-labelledby="inquiry-title">
      <h2 id="inquiry-title">Discuss a project</h2>
      <div class="inquiry-actions">
        <a class="text-link" id="email" href="mailto:niojin.noi@gmail.com?subject=Design%20project%20inquiry">Email Nio Jin</a>
        <button class="text-link" id="copy-email" type="button">Copy address</button>
      </div>
      <p class="visually-hidden" id="copy-status" role="status"></p>
    </section>
  </main>

  <dialog id="direction-dialog" aria-label="Design services">
    <div class="direction-sheet">
      <button class="text-link" id="direction-close" type="button" autofocus>Close</button>
      <nav class="direction-options" id="direction-options" aria-label="Project directions"></nav>
    </div>
  </dialog>

  <dialog id="case-dialog" aria-labelledby="case-title">
    <div class="case-bar">
      <button id="case-close" type="button" data-close-case autofocus>Back to the story</button>
    </div>
    <article class="case-body">
      <header class="case-copy measure">
        <h2 id="case-title"><a id="case-full"></a></h2>
        <div class="case-note">
          <button class="text-link" id="case-note-toggle" type="button" aria-controls="case-text" aria-expanded="false">About this work</button>
          <p id="case-text" tabindex="-1" hidden></p>
        </div>
      </header>
      <figure class="case-figure">
        <div class="case-media" id="case-media"></div>
        <figcaption class="case-caption">
          <p class="visually-hidden" id="media-label" aria-live="polite"></p>
          <button class="text-link" id="case-video-toggle" type="button" aria-keyshortcuts="ArrowLeft ArrowRight" hidden>Play video</button>
          <div id="case-controls">
            <button type="button" id="case-prev" aria-label="Previous media">Previous</button>
            <button type="button" id="case-next" aria-label="Next media">Next</button>
          </div>
          <button class="text-link" id="case-return" type="button" data-close-case>Back to the story</button>
        </figcaption>
      </figure>
    </article>
  </dialog>
</body>
</html>
